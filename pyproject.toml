[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hr-llm"
version = "0.2.0"
description = "GPT-2 fine-tuned on employee records: predicts attrition, job level, job satisfaction and monthly income."
readme = "README.md"
authors = [{ name = "Ismail Ben Alla", email = "ismailbenalla52@gmail.com" }]
requires-python = ">=3.10"
keywords = [
  "gpt-2", "transformer", "pytorch", "fine-tuning", "multi-task-learning", "nlp",
  "hr-analytics", "employee-attrition", "tabular-data", "gradio",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.49",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/benisalla/HR-LLM"
Documentation = "https://github.com/benisalla/HR-LLM/tree/main/docs"
Issues = "https://github.com/benisalla/HR-LLM/issues"

[project.optional-dependencies]
app = ["gradio>=4.44"]
dev = ["pytest>=8", "ruff>=0.9", "nbformat>=5", "matplotlib>=3.7"]

[project.scripts]
hr-train = "hr_llm.train:main"
hr-evaluate = "hr_llm.evaluate:main"
hr-predict = "hr_llm.predict:main"
hr-app = "hr_llm.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hr_llm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
