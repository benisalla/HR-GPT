[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hr-gpt"
version = "0.2.0"
description = "GPT-2 fine-tuned on employee records: predicts attrition, job level, job satisfaction and monthly income."
readme = "README.md"
authors = [{ name = "Ismail Ben Alla", email = "ismailbenalla52@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.49",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
app = ["gradio>=4.44"]
dev = ["pytest>=8", "ruff>=0.9", "nbformat>=5", "matplotlib>=3.7"]

[project.scripts]
hr-train = "hr_gpt.train:main"
hr-evaluate = "hr_gpt.evaluate:main"
hr-predict = "hr_gpt.predict:main"
hr-app = "hr_gpt.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hr_gpt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
